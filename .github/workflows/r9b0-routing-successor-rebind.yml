name: R9B0 routing successor rebind

on:
  pull_request:
    branches:
      - feature/r9a0-combined-native-implementation-v1

permissions:
  contents: write

jobs:
  rebind:
    if: github.head_ref == 'fix/r9b0-github-only-coordination-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r9b0-github-only-coordination-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact successor bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/native-project/test_r9b0_semantic_projection.py')
          s = test.read_text(encoding='utf-8')
          replacements = {
              'ef034b1ebafe6aa493dbca9fa3899a893f6cd463d929e4ff5acb3bf545a17223': '7ecff2ed732fc60f9b46264bb93e922555f89037e8a03e4ec3e91971bbaf6506',
              'f01a63f53b62da824c580e90a9651f828ed78a75dbbdab5a7c0768c6a5637fca': '9e4a8fc0b66ed31597524d1ebaa2ae4c6791751f9a071a5b365409570ceb37f3',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one lineage hash: {old}')
              s = s.replace(old, new)
          test.write_text(s, encoding='utf-8')

          matrix = Path('validation/R9B0_NATIVE_OBLIGATION_MATRIX.json')
          m = matrix.read_text(encoding='utf-8')
          old = 'Recovery must operate from native Project files, Supabase structured state, GitHub immutable source, and Drive evidence.'
          new = 'Recovery must operate from native Project files, the currently bound governed provider for authorized structured continuity state, GitHub immutable source/workflow evidence, and Drive evidence.'
          if m.count(old) != 1:
              raise SystemExit('expected exactly one K10 predecessor anchor')
          matrix.write_text(m.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/r9b0-routing-successor-rebind.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/native-project/test_r9b0_semantic_projection.py validation/R9B0_NATIVE_OBLIGATION_MATRIX.json .github/workflows/r9b0-routing-successor-rebind.yml
          git commit -m 'R9B0: rebind routing successor semantic lineage'
          git push origin HEAD:fix/r9b0-github-only-coordination-v1
