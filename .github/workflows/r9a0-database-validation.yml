name: R9A0 Database Validation

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - feature/r9a0-native-project-v1
    paths:
      - 'supabase/**'
      - 'scripts/supabase/**'
      - 'docs/database/**'
      - '.github/workflows/r9a0-database-validation.yml'

permissions:
  contents: read

jobs:
  validate-database:
    if: github.event.pull_request.head.ref == 'feature/r9a0-supabase-rebuild-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r9a0_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d r9a0_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: r9a0_ci
      R9A0_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/r9a0_ci
      R9A0_DISPOSABLE_DATABASE_CONFIRMED: 'YES'

    steps:
      - name: Checkout PR merge candidate
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0

      - name: Record candidate identity
        id: identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          printf 'base_sha=%s\n' '${{ github.event.pull_request.base.sha }}'
          printf 'head_sha=%s\n' '${{ github.event.pull_request.head.sha }}'
          printf 'merge_sha=%s\n' '${{ github.sha }}'

      - name: Bootstrap disposable PostgreSQL roles and extensions
        id: bootstrap
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          create schema if not exists extensions;
          create extension if not exists pgcrypto with schema extensions;
          do $$
          begin
            if not exists (select 1 from pg_roles where rolname = 'anon') then
              create role anon nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'authenticated') then
              create role authenticated nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'service_role') then
              create role service_role nologin noinherit;
            end if;
          end;
          $$;
          SQL

      - name: Apply foundation migration
        id: foundation_migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260806133000_r9a0_coordination_foundation.sql

      - name: Apply integrity repair migration
        id: integrity_migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20260806224900_r9a0_coordination_integrity_repairs.sql

      - name: Run foundation SQL suite
        id: foundation_tests
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/20260806133000_r9a0_coordination_foundation.test.sql

      - name: Run integrity SQL suite
        id: integrity_tests
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/20260806224900_r9a0_coordination_integrity_repairs.test.sql

      - name: Run deterministic two-session concurrency harness
        id: concurrency
        run: bash scripts/supabase/test_r9a0_two_session_concurrency.sh

      - name: Verify 14-file database manifest
        id: manifest
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          manifest_path = Path('docs/database/R9A0_DATABASE_SLICE_MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          files = manifest.get('files')
          if manifest.get('file_count') != 14 or not isinstance(files, list) or len(files) != 14:
              raise SystemExit('manifest must bind exactly 14 files')

          seen = set()
          for item in files:
              path = item['path']
              if path in seen:
                  raise SystemExit(f'duplicate manifest path: {path}')
              seen.add(path)
              file_path = Path(path)
              data = file_path.read_bytes()
              actual_hash = hashlib.sha256(data).hexdigest()
              if len(data) != item['bytes']:
                  raise SystemExit(f'byte-count mismatch: {path}')
              if actual_hash != item['sha256']:
                  raise SystemExit(f'sha256 mismatch: {path}')

          print('PASS: all 14 database manifest bindings match the PR merge candidate.')
          PY

      - name: Write auditable validation receipt
        if: always()
        id: receipt
        env:
          WORKFLOW_RESULT: ${{ job.status }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          BOOTSTRAP_RESULT: ${{ steps.bootstrap.outcome }}
          FOUNDATION_MIGRATION_RESULT: ${{ steps.foundation_migration.outcome }}
          INTEGRITY_MIGRATION_RESULT: ${{ steps.integrity_migration.outcome }}
          FOUNDATION_TEST_RESULT: ${{ steps.foundation_tests.outcome }}
          INTEGRITY_TEST_RESULT: ${{ steps.integrity_tests.outcome }}
          CONCURRENCY_RESULT: ${{ steps.concurrency.outcome }}
          MANIFEST_RESULT: ${{ steps.manifest.outcome }}
        run: |
          set -euo pipefail
          mkdir -p validation-receipt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              'schema': 'VERA_R9A0_DATABASE_CI_RECEIPT_V1',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'pull_request': int(os.environ['GITHUB_REF_NAME'].split('/')[0]),
              'workflow_run_id': int(os.environ['RUN_ID']),
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'workflow_result': os.environ['WORKFLOW_RESULT'],
              'base_sha': os.environ['BASE_SHA'],
              'head_sha': os.environ['HEAD_SHA'],
              'merge_sha': os.environ['MERGE_SHA'],
              'steps': {
                  'bootstrap': os.environ['BOOTSTRAP_RESULT'],
                  'foundation_migration': os.environ['FOUNDATION_MIGRATION_RESULT'],
                  'integrity_migration': os.environ['INTEGRITY_MIGRATION_RESULT'],
                  'foundation_sql_suite': os.environ['FOUNDATION_TEST_RESULT'],
                  'integrity_sql_suite': os.environ['INTEGRITY_TEST_RESULT'],
                  'deterministic_two_session_harness': os.environ['CONCURRENCY_RESULT'],
                  'manifest_bindings': os.environ['MANIFEST_RESULT'],
              },
              'target': 'DISPOSABLE_POSTGRESQL_SERVICE',
              'hosted_vera_apply_performed': False,
          }
          path = Path('validation-receipt/r9a0-database-ci-receipt.json')
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(path.read_text(encoding='utf-8'))
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('## R9A0 Database Validation Receipt\n\n')
              summary.write(f"- Result: `{receipt['workflow_result']}`\n")
              summary.write(f"- Head: `{receipt['head_sha']}`\n")
              summary.write(f"- Merge candidate: `{receipt['merge_sha']}`\n")
              summary.write(f"- Run ID: `{receipt['workflow_run_id']}`\n")
          PY

      - name: Upload validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r9a0-database-ci-receipt-${{ github.run_id }}
          path: validation-receipt/r9a0-database-ci-receipt.json
          if-no-files-found: error
