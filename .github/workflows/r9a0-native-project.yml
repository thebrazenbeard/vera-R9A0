name: R9A0 Native Project
# CI revalidation marker: Protocol Execution V2 added 2026-09-02.

on:
  push:
    branches:
      - feature/r9a0-native-project-v1
      - feature/r9a0-combined-native-implementation-v1
      - feature/r9b0-protocol-execution-v2
    paths:
      - 'project/**'
      - 'validation/**'
      - 'schemas/native-project/**'
      - 'scripts/validate_r9a0_project.py'
      - 'tests/native-project/**'
      - '.github/workflows/r9a0-native-project.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'validation/**'
      - 'schemas/native-project/**'
      - 'scripts/validate_r9a0_project.py'
      - 'tests/native-project/**'
      - '.github/workflows/r9a0-native-project.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native package
        run: python scripts/validate_r9a0_project.py --json
      - name: Run regression tests independently
        if: ${{ always() }}
        run: python -m unittest tests/native-project/test_r9a0_project.py -v
      - name: Run R9B0 semantic projection tests independently
        if: ${{ always() }}
        run: python -m unittest tests/native-project/test_r9b0_semantic_projection.py -v
      - name: Run Protocol Execution V2 regressions independently
        if: ${{ always() }}
        run: python -m unittest tests/native-project/test_r9b0_protocol_execution_v2.py -v
