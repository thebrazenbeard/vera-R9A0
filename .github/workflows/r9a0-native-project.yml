name: R9A0 Native Project
# CI revalidation marker: exact-head verification refreshed 2026-08-06.

on:
  push:
    branches:
      - feature/r9a0-native-project-v1
    paths:
      - 'project/**'
      - 'schemas/native-project/**'
      - 'scripts/validate_r9a0_project.py'
      - 'tests/native-project/**'
      - '.github/workflows/r9a0-native-project.yml'
  pull_request:
    paths:
      - 'project/**'
      - 'schemas/native-project/**'
      - 'scripts/validate_r9a0_project.py'
      - 'tests/native-project/**'
      - '.github/workflows/r9a0-native-project.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate native package
        run: python scripts/validate_r9a0_project.py --json
      - name: Run regression tests
        run: python -m unittest discover -s tests/native-project -p 'test_*.py' -v
