name: R9B0 test source copy

on:
  pull_request:
    branches:
      - feature/r9a0-combined-native-implementation-v1

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: r9b0-semantic-test-source
          path: tests/native-project/test_r9b0_semantic_projection.py
          if-no-files-found: error
