name: R9A0 Voice currentness qualification

on:
  push:
    branches:
      - qualification/voice-currentness-current-main-v1-20260930
    paths:
      - 'scripts/voice_currentness_guard.py'
      - 'tests/native-project/test_r9b0_voice_currentness_guard.py'
      - '.github/workflows/r9a0-voice-currentness.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/voice_currentness_guard.py'
      - 'tests/native-project/test_r9b0_voice_currentness_guard.py'
      - '.github/workflows/r9a0-voice-currentness.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact subject
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run Voice currentness guard tests
        run: python -m unittest tests/native-project/test_r9b0_voice_currentness_guard.py -v
