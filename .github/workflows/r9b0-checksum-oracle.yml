name: R9B0 checksum oracle

on:
  pull_request:
    branches:
      - feature/r9a0-combined-native-implementation-v1

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hash changed package members
        run: |
          sha256sum project/VERA_R9A0_PROJECT_INSTRUCTIONS.md project/VERA_R9A0_RUNTIME.md > r9b0-routing-checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r9b0-routing-checksums
          path: r9b0-routing-checksums.txt
          if-no-files-found: error
