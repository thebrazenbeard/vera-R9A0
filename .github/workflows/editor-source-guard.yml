name: R9A0 Editor Source Guard

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  editor-source-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject concealed editor-on-open source
        run: python -m unittest tests/native-project/test_r9a0_editor_security.py -v
